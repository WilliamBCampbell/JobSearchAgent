[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-agent"
version = "0.1.0"
description = "Local evidence-based job search with reviewed application workflows"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.148.0", "uvicorn==0.54.0", "psycopg[binary]==3.3.6",
  "pydantic==2.14.1", "mcp==2.3.0", "playwright==1.64.0",
  "pypdf==6.21.1", "python-docx==1.2.0", "beautifulsoup4==4.15.0",
  "lxml==6.1.3", "httpx==0.28.1", "pgvector==0.5.1"
]
[project.optional-dependencies]
dev = ["ruff==0.14.2"]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
[project.scripts]
jobsearch = "jobsearch.cli:main"
jobspy-mcp = "jobsearch.mcp_server:main"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.setuptools.packages.find]
where = ["src"]
